<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление заявкой</title>
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a href="index.html" class="logo">
                <svg width="140" height="32" viewBox="0 0 140 32" fill="none">
                    <rect width="32" height="32" rx="8" fill="#F46C38"/>
                    <text x="8" y="23" font-family="Arial" font-weight="800" font-size="18" fill="#fff">C</text>
                    <text x="42" y="23" font-family="Arial" font-weight="700" font-size="18" fill="#17181B">CloudCalc</text>
                </svg>
            </a>
        </div>
    </header>
    
    <main style="padding: 40px;" class="container content">
        <button class="btn-cta outline" onclick="window.location.href='index.html'" style="margin-bottom: 20px;">← На главную</button>
        
        <div style="background: #fff; padding: 40px; border-radius: 24px; border: 1px solid #e2e8f0; max-width: 550px; box-shadow: 0 10px 30px rgba(0,0,0,0.02);">
            <h1 id="formTitle" style="margin-bottom: 24px; font-size: 1.8rem; font-weight:800;">Новая заявка</h1>
            
            <form id="editForm" style="display: flex; flex-direction: column; gap: 20px;">
                <label style="display:flex; flex-direction:column; gap: 6px; font-weight:600; font-size: 14px;">
                    Тип оборудования:
                    <input type="text" id="equipmentType" required class="filter-input" style="width: 100%;">
                </label>
                <label style="display:flex; flex-direction:column; gap: 6px; font-weight:600; font-size: 14px;">
                    Вид моделирования:
                    <input type="text" id="modelingType" required class="filter-input" style="width: 100%;">
                </label>
                <label style="display:flex; flex-direction:column; gap: 6px; font-weight:600; font-size: 14px;">
                    Статус заявки:
                    <select id="status" class="filter-input" style="width: 100%; height: 44px;">
                        <option value="pending">pending</option>
                        <option value="completed">completed</option>
                        <option value="rejected">rejected</option>
                    </select>
                </label>
                <label style="display:flex; flex-direction:column; gap: 6px; font-weight:600; font-size: 14px;">
                    Интенсивность поступления (пакетов/сек):
                    <input type="number" id="packetArrivalRate" required class="filter-input" style="width: 100%;">
                </label>
                
                <button type="submit" class="btn-cta" style="margin-top: 10px; height: 46px;">Сохранить изменения</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 2026 CloudCalc. Лабораторная работа №6.</p>
        </div>
    </footer>

    <script type="module" src="src/edit.js"></script>
</body>
</html>
