<!DOCTYPE html><html lang=ru><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><title>Управление заявкой</title><body>
    <header class=site-header>
        <div class="container header-content">
            <a href=index.html class=logo>
                <svg width=140 height=32 fill=none viewBox="0 0 140 32"><rect width=32 height=32 fill=#f46c38 rx=8 /><text x=8 y=23 fill=#fff font-family=Arial font-size=18 font-weight=800>C</text><text x=42 y=23 fill=#17181b font-family=Arial font-size=18 font-weight=700>CloudCalc</text></svg>
            </a>
        </div>
    </header>
    
    <main style=padding:40px class="container content">
        <button class="btn-cta outline" onclick="window.location.href='index.html'" style=margin-bottom:20px>← На главную</button>
        
        <div style="background:#fff;border:1px solid #e2e8f0;border-radius:24px;max-width:550px;padding:40px;box-shadow:0 10px 30px #00000005">
            <h1 id=formTitle style=margin-bottom:24px;font-size:1.8rem;font-weight:800>Новая заявка</h1>
            
            <form id=editForm style=flex-direction:column;gap:20px;display:flex>
                <label style=flex-direction:column;gap:6px;font-size:14px;font-weight:600;display:flex>
                    Тип оборудования:
                    <input id=equipmentType required class=filter-input style=width:100%>
                </label>
                <label style=flex-direction:column;gap:6px;font-size:14px;font-weight:600;display:flex>
                    Вид моделирования:
                    <input id=modelingType required class=filter-input style=width:100%>
                </label>
                <label style=flex-direction:column;gap:6px;font-size:14px;font-weight:600;display:flex>
                    Статус заявки:
                    <select id=status class=filter-input style=width:100%;height:44px>
                        <option value=pending>pending</option>
                        <option value=completed>completed</option>
                        <option value=rejected>rejected</option>
                    </select>
                </label>
                <label style=flex-direction:column;gap:6px;font-size:14px;font-weight:600;display:flex>
                    Интенсивность поступления (пакетов/сек):
                    <input type=number id=packetArrivalRate required class=filter-input style=width:100%>
                </label>
                
                <button class=btn-cta style=height:46px;margin-top:10px>Сохранить изменения</button>
            </form>
        </div>
    </main>

    <footer class=site-footer>
        <div class=container>
            <p>© 2026 CloudCalc. Лабораторная работа №6.</p>
        </div>
    </footer>
